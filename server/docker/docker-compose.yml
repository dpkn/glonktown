# Glonktown on the host Mac: docker compose -f docker/docker-compose.yml up -d --build
# Paths are relative to this file: ~/Documents/glonktown/{server,runtime} and the stock resources in ~/Documents/open-toontown.
services:
  glonktown:
    image: glonktown-server
    platform: linux/amd64
    build: { context: .., dockerfile: docker/Dockerfile }
    container_name: glonktown
    restart: unless-stopped
    environment:
      TZ: Europe/Amsterdam
      # Docker Desktop hides each guest's own address (every connection arrives from its gateway), so the per-address limits
      # are shared by everyone: set them for the whole party
      MAX_PER_IP: "100"
      MAX_NEW_PER_MIN: "300"
      CLOG_PER_HOUR: "60000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ports:
      - "7380:80"
    volumes:
      - ../../../open-toontown/resources:/ot/src/resources:ro
      - ../../runtime/databases:/ot/src/astron/databases
      - ../../runtime/data:/ot/data
      - ../../runtime/web:/ot/web
